<!DOCTYPE html>
<html lang="es">
<head>

    <!-- Librería de iconos utilizada en el footer y otros elementos -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Producto | Makisá</title>

    <!-- Hoja de estilos principal de la aplicación -->
    <link rel="stylesheet" href="CSS/style.css">

    <!-- Importación de tipografías desde Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Poppins:wght@300;400;500;600&display=swap"
        rel="stylesheet">

</head>

<body>

<!-- Cabecera común presente en todas las páginas -->
<header>
    <nav>
        <h1 class="logo">Makisá</h1>

        <ul>
            <li><a href="index.html">Inicio</a></li>
            <li><a href="catalogo.html">Catálogo</a></li>
            <li><a href="sobre-mi.html">Sobre mí</a></li>
            <li><a href="contacto.html">Contacto</a></li>
        </ul>
    </nav>
</header>

<!--
    Plantilla reutilizable para mostrar el detalle de un producto.

    Los datos mostrados en esta sección no están escritos
    directamente en el HTML, sino que son insertados
    dinámicamente mediante JavaScript a partir del
    identificador recibido en la URL.
-->
<section class="producto-detalle">

    <!-- Imagen principal del producto -->
    <img
        id="producto-imagen"
        src=""
        alt=""
    >

    <div class="producto-info">
<!--  función de JavaScript que se encarga de cargar la información del producto en la página  --> 

        <!-- Categoría del producto -->
        <span id="producto-categoria"></span>

        <!-- Nombre del producto -->
        <h1 id="producto-nombre"></h1>

        <!-- Precio -->
        <p
            class="precio"
            id="producto-precio"
        ></p>

        <!-- Descripción -->
        <p
            id="producto-descripcion"
        ></p>

        <!-- Enlace al formulario de contacto -->
        <a
            href="contacto.html"
            class="btn"
        >
            Consultar producto
        </a>

    </div>

</section>

<!--
    Archivo JavaScript encargado de:
    1. Obtener el parámetro ?id= de la URL.
    2. Buscar el producto correspondiente.
    3. Cargar dinámicamente su información en esta página.
-->
<script src="js/productos.js"></script>

<footer>

    <h3>Makisá</h3>

    <p>Hecho a mano</p>

    <div class="redes">

        <a href="https://instagram.com/makisahechoamano"
           target="_blank"
           aria-label="Instagram de Makisá">

            <i class="fa-brands fa-instagram"></i>
            Instagram

        </a>

        <a href="https://wa.me/573108222286?text=Hola,%20me%20interesa%20un%20producto%20de%20Makisá"
           target="_blank"
           aria-label="WhatsApp de Makisá">

            <i class="fa-brands fa-whatsapp"></i>
            WhatsApp

        </a>

    </div>

    <p class="copyright">
        © 2025 Makisá · Todos los derechos reservados
    </p>

</footer>

</body>
</html>
